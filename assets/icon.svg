<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#F96A2F"/>
      <stop offset="100%" stop-color="#F54E00"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Hedgehog body -->
  <g transform="translate(256, 270)">
    <!-- Spikes (back) -->
    <ellipse cx="-10" cy="-50" rx="120" ry="90" fill="#2D2926"/>
    <!-- Individual spike points -->
    <polygon points="-100,-80 -80,-140 -60,-75" fill="#2D2926"/>
    <polygon points="-60,-100 -40,-160 -20,-95" fill="#2D2926"/>
    <polygon points="-20,-110 5,-170 30,-100" fill="#2D2926"/>
    <polygon points="25,-100 50,-160 70,-90" fill="#2D2926"/>
    <polygon points="60,-80 85,-135 100,-65" fill="#2D2926"/>
    <polygon points="-120,-40 -145,-90 -105,-60" fill="#2D2926"/>
    <polygon points="95,-40 125,-85 110,-30" fill="#2D2926"/>

    <!-- Body (tan/cream) -->
    <ellipse cx="10" cy="10" rx="95" ry="75" fill="#F0D6A8"/>

    <!-- Face area -->
    <ellipse cx="55" cy="5" rx="65" ry="60" fill="#F5E0BE"/>

    <!-- Nose -->
    <circle cx="110" cy="10" r="12" fill="#2D2926"/>

    <!-- Eye -->
    <circle cx="80" cy="-12" r="10" fill="#2D2926"/>
    <circle cx="83" cy="-15" r="3.5" fill="white"/>

    <!-- Mouth (subtle smile) -->
    <path d="M95,20 Q105,28 110,22" fill="none" stroke="#2D2926" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Ear -->
    <ellipse cx="45" cy="-45" rx="16" ry="20" fill="#E8C490" transform="rotate(-15, 45, -45)"/>

    <!-- Feet -->
    <ellipse cx="-30" cy="70" rx="22" ry="10" fill="#E8C490"/>
    <ellipse cx="30" cy="72" rx="22" ry="10" fill="#E8C490"/>
    <ellipse cx="80" cy="68" rx="20" ry="9" fill="#E8C490"/>
  </g>
</svg>
